<section id="{{ heading | slugify }}" class="py-12 px-8 w-full">
    <div class="container mx-auto flex justify-center">
        <div class="text-center">
            <div class="mb-3 text-sm font-bold uppercase tracking-[0.12em] text-purple-500">{{ kicker }}</div>
            <h2 class="mb-4 text-gray-900">{{ heading }}</h2>
            <div class="mb-12 text-gray-500">{{ description }}</div>
        </div>
    </div>
        <div class="max-w-6xl mx-auto">
            <div class="text-left flex flex-col lg:flex-row gap-8">
                {{ reviews }}
                <div class="flex flex-1 min-w-0 flex-col xl:py-12 gap-4">
                    {{ logo }}
                    <img src="{{ url }}" alt="{{ alt }}" class="h-20 self-start">
                    {{ /logo }}
                    <figure class="mt-4 flex flex-auto flex-col justify-between">
                        <blockquote>
                            <p class="text-lg leading-relaxed text-gray-800">“{{ testimonial }}”</p>
                        </blockquote>
                        <figcaption class="mt-4 flex items-center gap-x-6">
                            <div class="text-base">
                                <div class="font-bold text-gray-900">{{ name }}</div>
                                <div class="mt-1 text-sm text-gray-500">{{ role }}</div>
                            </div>
                        </figcaption>
                    </figure>
                </div>
                {{ /reviews }}
            </div>
        </div>
</section>
