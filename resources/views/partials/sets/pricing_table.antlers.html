<section id="pricing" class="bg-purple-50 py-12 px-8 w-full">
    <div class="container mx-auto flex justify-center">
        <div class="text-center">
            <div>
                <div class="mb-3 text-sm font-bold uppercase tracking-widest text-purple-500">Big on features. Kind on your budget.</div>
                <h2 class="mb-4 text-gray-900">{{ heading }}</h2>
                <div class="mb-12 text-gray-500">{{ blurb }}</div>
            </div>
            <div class="text-left flex flex-col md:flex-row gap-y-4 gap-x-8">
                {{ products }}
                    {{ partial:pricing_card }}
                {{ /products }}
            </div>
            <div class="flex flex-col gap-4">
                <div class="mt-12 [&>p]:text-lg [&>p+p]:text-sm [&>p+p]:text-gray-500">
                    {{ call_to_action }}
                </div>
                <div>
                    {{ partial:button url="{{ button_url }}" text="{{ button_label }}" variant="primary"}}
                </div>
            </div>
        </div>
    </div>
</section>
