<section id="{{ heading | slugify }}" class="bg-brand-off-white px-6 py-16 sm:px-8 lg:py-24">
    <div class="mx-auto max-w-7xl">
        <div class="grid items-start gap-12 lg:grid-cols-5 lg:gap-20">
            <div class="lg:sticky lg:top-24 lg:col-span-2">
                <p class="mb-3 text-sm font-bold uppercase tracking-[0.12em] text-purple-500">{{ eyebrow }}</p>
                <h2 class="mb-4 text-4xl leading-tight text-gray-900 sm:text-5xl">{{ heading }}</h2>
                <p class="mb-0 text-lg leading-relaxed text-gray-600">{{ intro }}</p>
            </div>
            <div class="lg:col-span-3">
                <div class="divide-y divide-gray-200">
                    {{ benefits }}
                        <article class="py-8 first:pt-0">
                            <div class="flex items-start gap-4">
                                <span class="mt-1 flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-purple-100 text-purple-600">
                                    <i class="{{ icon }}" aria-hidden="true"></i>
                                </span>
                                <div>
                                    <h3 class="text-xl font-black text-gray-900">{{ heading }}</h3>
                                    <p class="mt-3 mb-0 leading-relaxed text-gray-600">{{ description }}</p>
                                </div>
                            </div>
                            {{ if quote }}
                                <figure class="mt-6 rounded-r-xl border-l-4 border-purple-600 bg-purple-100 p-5 sm:ml-16">
                                    <figcaption class="mb-4 flex items-center gap-3 text-xs font-bold uppercase tracking-[0.12em] text-purple-800">
                                        <img src="/assets/hayley.jpeg" alt="" class="h-10 w-10 rounded-full object-cover" loading="lazy" />
                                        {{ quote_heading }}
                                    </figcaption>
                                    <blockquote>
                                        <p class="mb-0 text-base italic leading-relaxed text-gray-800">“{{ quote }}”</p>
                                    </blockquote>
                                </figure>
                            {{ /if }}
                        </article>
                    {{ /benefits }}
                </div>
            </div>
        </div>
    </div>
</section>
