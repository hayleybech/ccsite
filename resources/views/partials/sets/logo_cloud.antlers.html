<section id="{{ heading | slugify }}" class="bg-white px-8 py-16 sm:py-8">
    <div class="container mx-auto">
        <h2 class="text-center text-purple-500">{{heading}}</h2>
            <div class="mx-auto flex flex-wrap sm:grid max-w-lg grid-cols-3 items-center justify-center gap-x-8 gap-y-10 sm:max-w-xl sm:grid-cols-5 sm:gap-x-10 lg:mx-0 lg:max-w-none lg:grid-cols-5">
        {{ logos }}
                {{ logo_image }}
                {{ if ratio>1 }}
                    <img class=" max-h-16 w-[calc((100%-64px)/3)] sm:w-full object-contain" src="{{ url }}" alt="{{ alt }}" width="150" height="150">
                {{ else }}
                    <img class="max-h-24 w-[calc((100%-64px)/3)] sm:w-full object-contain" src="{{ url }}" alt="{{ alt }}" width="300" height="300">
                {{ /if }}
                {{ /logo_image }}
        {{ /logos }}
            </div>
    </div>
</section>
