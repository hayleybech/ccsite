<section id="features" class="py-16 px-8 bg-gray-100" data-feature-tabs>
    <div class="container mx-auto max-w-7xl">
        <div class="mx-auto max-w-5xl text-center">
            <h2 class="text-purple-500">{{ heading }}</h2>
            <p class="mt-4">{{ intro }}</p>
        </div>
        <div role="tablist" aria-label="Feature categories" class="mx-auto mt-8 grid max-w-5xl grid-cols-3 border-b border-gray-300">
            <button id="music-learning-tab" type="button" role="tab" aria-selected="true" aria-controls="music-learning-panel" data-feature-tab class="feature-tab relative px-3 py-4 text-center font-semibold text-gray-600 transition-colors sm:px-6">
                Music
                <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-1 bg-gray-200"><span data-tab-progress class="feature-tab-progress block h-full w-full bg-purple-500"></span></span>
            </button>
            <button id="singers-membership-tab" type="button" role="tab" aria-selected="false" aria-controls="singers-membership-panel" data-feature-tab tabindex="-1" class="feature-tab relative px-3 py-4 text-center font-semibold text-gray-600 transition-colors sm:px-6">
                Singers
                <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-1 bg-gray-200"><span data-tab-progress class="feature-tab-progress block h-full w-full bg-purple-500"></span></span>
            </button>
            <button id="events-performances-tab" type="button" role="tab" aria-selected="false" aria-controls="events-performances-panel" data-feature-tab tabindex="-1" class="feature-tab relative px-3 py-4 text-center font-semibold text-gray-600 transition-colors sm:px-6">
                Events
                <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-1 bg-gray-200"><span data-tab-progress class="feature-tab-progress block h-full w-full bg-purple-500"></span></span>
            </button>
        </div>
        <div class="mx-auto mt-8 max-w-5xl">
            {{ features }}
                <div id="{{ id }}-panel" role="tabpanel" aria-labelledby="{{ id }}-tab" {{ if id != "music-learning" }}hidden{{ /if }}>
                    <article class="flex flex-col items-start">
                        <h3 class="text-lg font-semibold text-purple-500">{{ heading }}</h3>
                        <p class="mt-3">{{ description }}</p>
                        <a href="{{ link_url }}" class="mt-4 font-semibold text-purple-500 hover:text-purple-600">{{ link_label }}</a>
                        {{ if image }}
                            <img src="/assets/{{ image }}" alt="{{ heading }}" class="mt-4 w-full rounded-lg" />
                        {{ /if }}
                    </article>
                </div>
            {{ /features }}
        </div>
        <div class="mt-12 text-center">
            <h3 class="text-lg font-semibold text-purple-500">{{ cta_heading }}</h3>
            <a href="{{ cta_url }}" class="mt-4 inline-block font-semibold text-purple-500 hover:text-purple-600">{{ cta_label }}</a>
        </div>
    </div>
</section>
