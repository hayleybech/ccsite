<section id="features" class="bg-white py-12 px-6 lg:px-8 w-full">
    <div class="container mx-auto flex justify-center">
        <div class="text-center">
            <div class="mb-3 text-sm font-bold uppercase tracking-[0.12em] text-purple-500">{{ eyebrow }}</div>
            <h2 class="mb-4 text-gray-900">{{ heading }}</h2>
            <div class="mb-12 text-gray-500">{{ intro }}</div>
        </div>
    </div>
    <div data-features-container class="mx-auto flex w-full max-w-6xl items-center gap-0 sm:gap-3">
        <button type="button" data-features-scroll="left" aria-label="Scroll features left" class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white text-purple-600 shadow-md ring-1 ring-gray-200 transition hover:bg-purple-50 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-40 sm:flex">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                <path d="m15 18-6-6 6-6" />
            </svg>
        </button>
        <div class="flex min-w-0 flex-1 flex-col">
            <div id="features-carousel" data-features-carousel role="region" aria-label="Feature cards" tabindex="0" class="features-scrollbar flex snap-x snap-mandatory items-stretch gap-4 lg:gap-6 overflow-x-auto px-1.5 pt-3 pb-4 scroll-smooth focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                {{ features }}
                    <article class="w-[80%] shrink-0 snap-start scroll-ml-1.5 flex flex-col overflow-hidden rounded-xl bg-white shadow-sm ring-1 ring-gray-200 transition duration-200 hover:-translate-y-1 hover:shadow-lg sm:w-72">
                        {{ if image }}
                            <div class="relative p-4 {{ [ 'bg-purple-100' => id === 'music-learning', 'bg-sky-100' => id === 'singers-membership', 'bg-orange-100' => id === 'events-performances', 'bg-emerald-100' => id === 'choir-organisation' ] | classes }}">
                                <img src="/assets/{{ image }}" alt="{{ heading }}" class="aspect-video w-full rounded-lg object-contain" loading="lazy" />
                                <button type="button" data-image-modal-open="{{ id }}-image-modal" aria-label="Zoom in on {{ heading }}" class="absolute bottom-6 right-6 flex h-10 w-10 items-center justify-center rounded-full bg-white text-gray-800 shadow-md transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                                    <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                                        <circle cx="10.5" cy="10.5" r="6.5" />
                                        <path d="m15.5 15.5 5 5M10.5 7.5v6m-3-3h6" />
                                    </svg>
                                </button>
                            </div>
                            <dialog id="{{ id }}-image-modal" aria-label="Expanded image: {{ heading }}" class="image-modal w-[min(90vw,95rem)] max-w-none rounded-xl bg-white p-3 shadow-2xl backdrop:bg-gray-900/75">
                                <div class="flex justify-end pb-2">
                                    <button type="button" data-image-modal-close aria-label="Close image" class="flex h-10 w-10 items-center justify-center rounded-full text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                                        <i class="fas fa-times" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <img src="/assets/{{ image }}" alt="{{ heading }}" class="mx-auto max-h-[80vh] w-auto rounded-lg object-contain" />
                            </dialog>
                        {{ /if }}
                        <div class="flex flex-1 flex-col p-4 lg:p-6">
                            <h3 class="font-black text-xl text-gray-900">{{ heading }}</h3>
                            <p class="mt-3 text-sm text-gray-500">{{ description }}</p>
                            <a href="{{ link_url }}" class="mt-auto pt-6 text-sm font-semibold text-purple-500 hover:text-purple-600">{{ link_label }} <i class="fas fa-long-arrow-right ml-2" aria-hidden="true"></i></a>
                        </div>
                    </article>
                {{ /features }}
            </div>
            <div data-features-scrollbar role="scrollbar" aria-label="Feature cards scroll position" aria-controls="features-carousel" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0" class="mt-2 h-2 cursor-pointer touch-none rounded-full bg-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                <div data-features-scrollbar-thumb class="h-full rounded-full bg-purple-500"></div>
            </div>
        </div>
        <button type="button" data-features-scroll="right" aria-label="Scroll features right" class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white text-purple-600 shadow-md ring-1 ring-gray-200 transition hover:bg-purple-50 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-40 sm:flex">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                <path d="m9 18 6-6-6-6" />
            </svg>
        </button>
    </div>
    <div class="mt-12 text-center">
        <h3 class="text-base font-medium text-gray-500">{{ cta_heading }}</h3>
        <div class="mt-4">
            {{ partial:button url="{{ cta_url }}" text="{{ cta_label }}" variant="secondary" arrow="true" }}
        </div>
    </div>
</section>
