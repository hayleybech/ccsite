<section id="{{ heading | slugify }}" class="py-16 px-8 bg-gray-100">
    <div class="container mx-auto max-w-7xl">
        <div class="mx-auto max-w-3xl text-center">
            <h2 class="text-purple-800">{{ heading }}</h2>
            <p class="mt-4">{{ intro }}</p>
        </div>
        <div class="mt-12 grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
            {{ features }}
                <article class="flex flex-col items-start">
                    {{ if image }}
                        <img src="/assets/{{ image }}" alt="{{ heading }}" class="mb-4 w-full rounded-lg" />
                    {{ /if }}
                    <h3 class="text-lg font-semibold text-purple-800">{{ heading }}</h3>
                    <p class="mt-3">{{ description }}</p>
                    <a href="{{ link_url }}" class="mt-4 font-semibold text-purple-800 hover:text-purple-600">{{ link_label }}</a>
                </article>
            {{ /features }}
        </div>
        <div class="mt-12 text-center">
            <h3 class="text-lg font-semibold text-purple-800">{{ cta_heading }}</h3>
            <a href="{{ cta_url }}" class="mt-4 inline-block font-semibold text-purple-800 hover:text-purple-600">{{ cta_label }}</a>
        </div>
    </div>
</section>
