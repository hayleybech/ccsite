<section id="multi-choirs" class="bg-gradient-to-b from-sky-50 to-purple-100 px-6 py-16 lg:px-8 lg:py-20">
    <div class="container mx-auto max-w-6xl">
        <div class="mx-auto mb-12 max-w-3xl text-center">
            <div class="mb-3 text-sm font-bold uppercase tracking-[0.12em] text-purple-600">{{ eyebrow }}</div>
            <h2 class="mb-4 text-gray-900">{{ heading }}</h2>
            <p class="mb-4 text-lg text-gray-600">{{ intro }}</p>
            <p class="font-semibold italic text-gray-800">{{ emphasis }}</p>
        </div>

        <div class="relative grid grid-cols-1 gap-8 md:grid-cols-2">
            {{ cards }}
                <article class="flex flex-col overflow-hidden rounded-2xl bg-white shadow-lg ring-1 ring-gray-900/5">
                    <div class="relative p-5 sm:p-8 {{ [ 'bg-purple-100' => id === 'single-login', 'bg-sky-100' => id === 'ensembles' ] | classes }}">
                        <img src="/assets/{{ image }}" alt="{{ heading }}" class="aspect-video w-full rounded-xl object-contain" loading="lazy" />
                        <button type="button" data-image-modal-open="{{ id }}-image-modal" aria-label="Zoom in on {{ heading }}" class="absolute bottom-6 right-6 flex h-10 w-10 items-center justify-center rounded-full bg-white text-gray-800 shadow-md transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                                <circle cx="10.5" cy="10.5" r="6.5" />
                                <path d="m15.5 15.5 5 5M10.5 7.5v6m-3-3h6" />
                            </svg>
                        </button>
                    </div>

                    <dialog id="{{ id }}-image-modal" aria-label="Expanded image: {{ heading }}" class="image-modal w-[min(90vw,72rem)] max-w-none rounded-xl bg-white p-3 shadow-2xl backdrop:bg-gray-900/75">
                        <div class="flex justify-end pb-2">
                            <button type="button" data-image-modal-close aria-label="Close image" class="flex h-10 w-10 items-center justify-center rounded-full text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                                <i class="fas fa-times" aria-hidden="true"></i>
                            </button>
                        </div>
                        <img src="/assets/{{ image }}" alt="{{ heading }}" class="mx-auto max-h-[80vh] w-auto rounded-lg object-contain" />
                    </dialog>
                    <div class="flex flex-1 flex-col p-6 sm:p-8">
                        <h3 class="text-xl font-black text-gray-900">{{ heading }}</h3>
                        <p class="mt-3 text-gray-600">{{ description }}</p>
                        <a href="{{ link_url }}" class="mt-auto inline-flex items-center pt-6 font-semibold text-purple-700 hover:text-purple-800">
                            {{ link_label }}
                            <i class="fas fa-long-arrow-right ml-2" aria-hidden="true"></i>
                        </a>
                    </div>
                </article>
                {{ if id === 'single-login' }}
                    <div class="z-10 mx-auto -my-3 w-fit rounded-full border-2 border-purple-500 bg-white px-3 py-1 text-sm font-bold text-purple-700 shadow-sm md:absolute md:left-1/2 md:top-1/3 md:my-0 md:-translate-x-1/2 md:-translate-y-1/2">
                        {{ callout }}
                    </div>
                {{ /if }}
            {{ /cards }}
        </div>
    </div>
</section>
