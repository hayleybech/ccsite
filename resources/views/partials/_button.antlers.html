<a
    href="{{ url }}"
    class="
        font-semibold text-sm text-center px-10 py-3 rounded-md shadow-md inline-block
        {{ [
            'text-white bg-purple-500 hover:bg-purple-600' => variant==='primary',
            'text-purple-500 hover:text-purple-600 bg-white border border-gray-300 hover:border-gray-400' => variant==='secondary-inv' || variant==='secondary',
        ] | classes}}
     "
    {{ if external }}
        target="_blank"
        rel="noopener noreferrer"
    {{ /if }}
>
    {{ text }}{{ if arrow }} <i class="far fa-long-arrow-right ml-2" aria-hidden="true"></i>{{ /if }}
</a>
