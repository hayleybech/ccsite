<div class="bg-white mb-2 flex flex-col rounded-md px-6 py-8 border drop-shadow-sm group items-left {{ [ 'border-gray-300' => name !== 'Medium', 'border-purple-500' => name === 'Medium' ] | classes }}">
    <h3 class="font-extrabold mb-2 text-2xl">{{ name }}</h3>
    <div class="text-xs text-gray-500 mb-8">{{ description }}</div>
    <div class="mb-8">
        <div class="flex flex-row gap-2 justify-items-center mb-1.5">
            <div class="font-heading text-4xl font-extrabold text-gray-900">{{ price }}</div>
            <div class="flex flex-col">
                {{ if currency }}  <div class="text-sm text-gray-500">{{ currency }}</div> {{ /if }}
                {{ if frequency }}<div class="text-sm text-gray-500">{{ frequency }}</div> {{ /if }}
            </div>
        </div>
        <div>
            {{if price !== 'FREE'}}
                <em class="text-xs text-gray-500">paid annually</em>
            {{ else }}
            &nbsp;
            {{ /if }}
        </div>
    </div>
    <div>
        <ul class="list-inside text-xs text-gray-600 space-y-4">
            {{ features }}
            <li>
                <i class="fal fa-check text-purple-500 mr-2"></i>
                {{ value }}
            </li>
            {{ /features }}
        </ul>
    </div>
</div>
