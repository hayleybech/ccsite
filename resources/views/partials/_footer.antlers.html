<footer class="bg-white px-8 py-10">
    <div class="container mx-auto">
        <div class="flex flex-col justify-between gap-y-8 lg:flex-row lg:items-start">
            <div class="flex flex-col gap-4 lg:w-1/3">
                {{ asset url="/assets/logo-dark.svg" }}
                    <a href="/"><img src="{{ url }}" alt="{{ alt }}" class="h-11"></a>
                {{ /asset }}
                <p class="mb-0 text-sm text-gray-600">
                    Made for choirs. With a whole lot of heart.
                    <i class="fas fa-heart text-purple-500" aria-hidden="true"></i>
                </p>
            </div>
            {{ partial:footer-nav }}
        </div>
        <div class="mt-8 flex flex-col justify-between gap-y-4 text-xs text-gray-600 sm:flex-row sm:items-center">
            <div class="flex gap-2 text-lg text-gray-700">
                <i class="fab fa-facebook-square" aria-hidden="true"></i>
                <i class="fab fa-twitter-square" aria-hidden="true"></i>
            </div>
            <div class="flex flex-col gap-y-2 sm:flex-row sm:items-center sm:gap-x-4">
                <span>© Choir Concierge {{ now format="Y" }}</span>
                <div class="flex gap-4">
                    <a class="hover:text-purple-500" href="/privacy-policy">Privacy Policy</a>
                    <a class="hover:text-purple-500" href="/terms-of-service">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>
</footer>
